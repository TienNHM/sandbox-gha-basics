name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy code
        uses: actions/checkout@v7

      - name: Cài Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cài thư viện
        run: npm ci

      - name: Chạy test
        run: npm test
