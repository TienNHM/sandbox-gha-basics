name: Secret demo

on: workflow_dispatch

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Dùng secret qua env
        env:
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          echo "Độ dài token: ${#DEMO_TOKEN}"
          echo "Thử in token: $DEMO_TOKEN"
          echo "$DEMO_TOKEN" | rev
