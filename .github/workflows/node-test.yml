name: Node test (reusable)

on:
  workflow_call:
    inputs:
      node-version:
        description: "Phiên bản Node.js"
        type: string
        required: true

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cài project
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ inputs.node-version }}

      - run: npm test
